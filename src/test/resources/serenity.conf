screenplay.pronouns="el,ella,ellos"
environments {
    chrome {
        webdriver {
            driver = chrome
            autodownload = true
            capabilities {
                browserName = "chrome"
                acceptInsecureCerts = true
                "goog:chromeOptions"{
                    arg = ["start-maximized","test-type","ignore-certificate-errors",
                    "incognito", "disable-infobars", "disable-gpu", "disable-default-apps","disable-popup-blocking"]
                }
            }
        }
    }
}

pages{
    orangehrm = "https://opensource-demo.orangehrmlive.com/web/index.php/auth/login"
}

serenity {
  take {
    screenshots = "FOR_EACH_ACTION"
  }

  screenshots {
    for {
      each {
        step = true
      }
    }
  }

  reports {
    show {
      step {
        details = true
      }
    }
    hide {
      step {
        details = false
      }
    }
    encoding = "UTF-8"
  }
}